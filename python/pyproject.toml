[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smsdock-client"
version = "0.1.0"
description = "Python client and command-line tool for the SMS Dock WebSocket API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["websockets>=15.0,<18.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
smsdock = "smsdock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
