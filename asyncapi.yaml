          payload: {"event": "sms.received", "seq": 42, "data": {"message": {"id": 2815, "conversationId": 179, "address": "+4369912345678", "contact": null, "direction": "in", "body": "STATUS", "timestamp": 1790672531000, "sentTimestamp": 1790672529000, "read": false, "status": "received", "sim": 1, "requestId": null}}}
    smsQueued:
