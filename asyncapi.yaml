asyncapi: 3.0.0

info:
  title: SMS Dock WebSocket API
  version: 1.0.0
  description: |
    SMS Dock turns an Android phone into an SMS hub. This API lets programs
    read, send and delete SMS and react to incoming ones.

    This document describes **protocol version 1**. The text form of the
    same contract is `API.md`; if the two differ, `API.md` is right.

    ## Transport

    - WebSocket over TLS, `wss://PHONE_IP:9443/ws`. The port can be changed
      in the app.
    - Text frames only. Each frame is one UTF-8 JSON object. Frames sent
      by the client may have at most 64 KiB; answers of the server can be
      larger.
    - At most 8 clients can be connected at once.
    - The API needs the full licence of the app.

    ## Certificate

    The phone uses a self-signed certificate that names no host or address,
    so ordinary verification cannot succeed. Clients pin it instead: they
    compare the SHA-256 fingerprint of the certificate the server presents
    with the fingerprint shown in the app (Server screen), and only then
    send the password.

    ## Requests and responses

    A request is an object with an `action` and, optionally, an `id`
    (string or number) that the response echoes. A response is either
    `{"id", "ok": true, "result": {…}}` or
    `{"id", "ok": false, "error": {"code", "message"}}`. Every response
    has an `id`; it is `null` if the request had none or could not be
    read.

    ## Phone numbers

    In `to`, spaces, dashes, dots, slashes and brackets are ignored.

    Where a number selects messages (`messages.list.address`,
    `subscribe.address`), it is compared the way the phone's messaging app
    does: `+43 699 1234567`, `0043 699 1234567` and `0699 1234567` mean
    the same peer. A number without country code matches if its digits
    without leading zeros (at least 7) end the other number. Sender names
    such as `MyBank` are compared as text, ignoring case.

    ## Events

    `seq` increases by one per event, counted over all events of the
    phone. A client that subscribed to some events, or filters by number,
    therefore sees gaps. The count restarts at 1 when the app is
    restarted; `epoch` in the result of `authenticate` tells one run of
    the app from the next. Events are not sent again: what happens while
    a client is not connected is lost for it.

    ## Objects

    Timestamps are milliseconds since the Unix epoch. Fields that do not
    apply are `null`, never left out.

    ## Error codes

    | Code | Meaning |
    |---|---|
    | `invalid_json` | The frame is not a JSON object |
    | `invalid_request` | A field is missing or malformed |
    | `unknown_action` | |
    | `not_authenticated` | Authenticate first |
    | `invalid_password` | |
    | `locked_out` | Too many wrong passwords; `retryAfter` in the error object holds the seconds to wait |
    | `licence_required` | The API needs the full licence |
    | `quota_exceeded` | Daily sending limit of the free version reached |
    | `rate_limited` | Too many requests per second (`retryAfter` holds the seconds to wait) or messages per minute |
    | `permission_missing` | An Android permission is not granted; `permission` in the error object names it |
    | `invalid_number` | |
    | `message_too_long` | More than 10 SMS parts |
    | `sim_unavailable` | The SIM is missing, or no default SMS SIM is set on the phone |
    | `not_found` | |
    | `not_default_app` | Needs SMS Dock as the phone's default SMS app |
    | `send_failed` | Android refused the message |
    | `internal_error` | |

    ## Close codes

    | Code | Meaning |
    |---|---|
    | 1000 | Normal |
    | 1001 | Server is stopping |
    | 1009 | Frame from the client larger than 64 KiB |
    | 4400 | Protocol error, for example a binary frame |
    | 4401 | Not authenticated in time, wrong password, or logins locked |
    | 4403 | Licence required |
    | 4408 | No answer to pings |
    | 4409 | Too many clients |
    | 4410 | Password was changed |
    | 4429 | The client kept sending although its requests were answered with `rate_limited` |

    ## Limits

    | Limit | Value |
    |---|---|
    | Frame size, client to server | 64 KiB |
    | Clients | 8 |
    | Requests | 20 per second per connection |
    | Sending | 20 SMS parts per minute for the whole phone |
    | Message length | 10 SMS parts (1530 plain or 670 Unicode characters) |
    | Page size | 200 |

defaultContentType: application/json

servers:
  phone:
    host: '{host}:{port}'
    protocol: wss
    description: |
      The phone that runs SMS Dock, reached in the local network. The
      WebSocket endpoint is the path `/ws` (see the channel `api`), so the
      full address is `wss://192.168.1.50:9443/ws`.

      The certificate is self-signed. Pin its SHA-256 fingerprint; do not
      switch verification off without pinning. Do not expose the port to
      the internet.

      After 5 wrong passwords (web interface and API together) logins are
      locked for 30 seconds, doubling up to 15 minutes.
    variables:
      host:
        description: Address of the phone in the local network, shown in the app.
        default: 192.168.1.50
      port:
        description: API port. It can be changed in the settings of the app.
        default: '9443'

channels:
  api:
    address: /ws
    title: SMS Dock API
    description: |
      The only channel. All requests, responses and events travel over this
      one WebSocket as text frames. Each frame is one UTF-8 JSON object.
      Frames sent by the client may have at most 64 KiB; answers of the
      server can be larger.

      The server speaks first and sends `hello`. The client answers with
      `authenticate`. After that the client sends requests and the server
      answers each of them with one response. Responses may arrive in a
      different order than the requests were sent, and events may arrive in
      between; match responses by `id`.
    servers:
      - $ref: '#/servers/phone'
    bindings:
      ws:
        bindingVersion: 0.1.0
    messages:
      hello:
        $ref: '#/components/messages/hello'
      authenticateRequest:
        $ref: '#/components/messages/authenticateRequest'
      authenticateResponse:
        $ref: '#/components/messages/authenticateResponse'
      getStatusRequest:
        $ref: '#/components/messages/getStatusRequest'
      getStatusResponse:
        $ref: '#/components/messages/getStatusResponse'
      listConversationsRequest:
        $ref: '#/components/messages/listConversationsRequest'
      listConversationsResponse:
        $ref: '#/components/messages/listConversationsResponse'
      listMessagesRequest:
        $ref: '#/components/messages/listMessagesRequest'
      listMessagesResponse:
        $ref: '#/components/messages/listMessagesResponse'
      getMessageRequest:
        $ref: '#/components/messages/getMessageRequest'
      getMessageResponse:
        $ref: '#/components/messages/getMessageResponse'
      sendMessageRequest:
        $ref: '#/components/messages/sendMessageRequest'
      sendMessageResponse:
        $ref: '#/components/messages/sendMessageResponse'
      getMessageStatusRequest:
        $ref: '#/components/messages/getMessageStatusRequest'
      getMessageStatusResponse:
        $ref: '#/components/messages/getMessageStatusResponse'
      deleteMessageRequest:
        $ref: '#/components/messages/deleteMessageRequest'
      deleteMessageResponse:
        $ref: '#/components/messages/deleteMessageResponse'
      deleteConversationRequest:
        $ref: '#/components/messages/deleteConversationRequest'
      deleteConversationResponse:
        $ref: '#/components/messages/deleteConversationResponse'
      markConversationReadRequest:
        $ref: '#/components/messages/markConversationReadRequest'
      markConversationReadResponse:
        $ref: '#/components/messages/markConversationReadResponse'
      listContactsRequest:
        $ref: '#/components/messages/listContactsRequest'
      listContactsResponse:
        $ref: '#/components/messages/listContactsResponse'
      subscribeRequest:
        $ref: '#/components/messages/subscribeRequest'
      subscribeResponse:
        $ref: '#/components/messages/subscribeResponse'
      unsubscribeRequest:
        $ref: '#/components/messages/unsubscribeRequest'
      unsubscribeResponse:
        $ref: '#/components/messages/unsubscribeResponse'
      pingRequest:
        $ref: '#/components/messages/pingRequest'
      pingResponse:
        $ref: '#/components/messages/pingResponse'
      errorResponse:
        $ref: '#/components/messages/errorResponse'
      smsReceived:
        $ref: '#/components/messages/smsReceived'
      smsQueued:
        $ref: '#/components/messages/smsQueued'
      smsSent:
        $ref: '#/components/messages/smsSent'
      smsDelivered:
        $ref: '#/components/messages/smsDelivered'
      smsFailed:
        $ref: '#/components/messages/smsFailed'
      smsDeleted:
        $ref: '#/components/messages/smsDeleted'
      conversationsChanged:
        $ref: '#/components/messages/conversationsChanged'

operations:
  sayHello:
    action: send
    channel:
      $ref: '#/channels/api'
    summary: Greeting of the server
    description: |
      Sent by the server as the first frame after the WebSocket opens. The
      client must answer within 10 seconds with `authenticate`; otherwise
      the server closes the connection with code 4401.
    messages:
      - $ref: '#/channels/api/messages/hello'
  authenticate:
    action: receive
    channel:
      $ref: '#/channels/api'
    summary: Log in
    description: |
      Action `authenticate`. Must be the first request, at most 10 seconds
      after `hello`. On `invalid_password` and `locked_out` the server closes
      the connection with code 4401, on `licence_required` with code 4403.
      After 5 wrong passwords (web interface and API together) logins are
      locked for 30 seconds, doubling up to 15 minutes. The result tells
      `latestSeq`, the sequence number of the newest event so far, and
      `epoch`, which identifies one run of the app.
    messages:
      - $ref: '#/channels/api/messages/authenticateRequest'
    reply:
      channel:
        $ref: '#/channels/api'
      messages:
        - $ref: '#/channels/api/messages/authenticateResponse'
        - $ref: '#/channels/api/messages/errorResponse'
  getStatus:
    action: receive
    channel:
      $ref: '#/channels/api'
    summary: Phone, SIMs, permissions, limits
    description: |
      Action `status`. No fields. Before the login the answer is the error
      `not_authenticated`.
    messages:
      - $ref: '#/channels/api/messages/getStatusRequest'
    reply:
      channel:
        $ref: '#/channels/api'
      messages:
        - $ref: '#/channels/api/messages/getStatusResponse'
        - $ref: '#/channels/api/messages/errorResponse'
  listConversations:
    action: receive
    channel:
      $ref: '#/channels/api'
    summary: Conversations, one per phone number
    description: |
      Action `conversations.list`. Returns a page of conversations, newest
      first. Before the login the answer is the error `not_authenticated`.
    messages:
      - $ref: '#/channels/api/messages/listConversationsRequest'
    reply:
      channel:
        $ref: '#/channels/api'
      messages:
        - $ref: '#/channels/api/messages/listConversationsResponse'
        - $ref: '#/channels/api/messages/errorResponse'
  listMessages:
    action: receive
    channel:
      $ref: '#/channels/api'
    summary: Messages, filtered and paged
    description: |
      Action `messages.list`. Returns a page of messages, newest first. The
      last 10 incoming messages: `direction` `in`, `limit` 10.
      `conversationId` wins if `address` is given too. Before the login the
      answer is the error `not_authenticated`.
    messages:
      - $ref: '#/channels/api/messages/listMessagesRequest'
    reply:
      channel:
        $ref: '#/channels/api'
      messages:
        - $ref: '#/channels/api/messages/listMessagesResponse'
        - $ref: '#/channels/api/messages/errorResponse'
  getMessage:
    action: receive
    channel:
      $ref: '#/channels/api'
    summary: One message
    description: |
      Action `messages.get`. Returns one message. Before the login the answer
      is the error `not_authenticated`.
    messages:
      - $ref: '#/channels/api/messages/getMessageRequest'
    reply:
      channel:
        $ref: '#/channels/api'
      messages:
        - $ref: '#/channels/api/messages/getMessageResponse'
        - $ref: '#/channels/api/messages/errorResponse'
  sendMessage:
    action: receive
    channel:
      $ref: '#/channels/api'
    summary: Send an SMS
    description: |
      Action `messages.send`. Hands an SMS to the phone for sending. The
      outcome arrives as `sms.sent`, `sms.delivered` or `sms.failed` events
      and can be read with `messages.status`. Sending exactly once: if the
      connection breaks, send the request again with the same `requestId`. The
      phone does not send twice but answers with the SendResult of the first
      request and its current `status`. A `requestId` is remembered for 30
      days, also across restarts of the app. Using it again for another
      recipient or text is answered with `invalid_request`. A repeat never
      sends again, also not after the first attempt failed: the answer then
      has the status `failed`. To try again, use a new `requestId`. Before the
      login the answer is the error `not_authenticated`.
    messages:
      - $ref: '#/channels/api/messages/sendMessageRequest'
    reply:
      channel:
        $ref: '#/channels/api'
      messages:
        - $ref: '#/channels/api/messages/sendMessageResponse'
        - $ref: '#/channels/api/messages/errorResponse'
  getMessageStatus:
    action: receive
    channel:
      $ref: '#/channels/api'
    summary: State of a sent SMS
    description: |
      Action `messages.status`. Returns the outbox entry of a message sent
      through SMS Dock. Before the login the answer is the error
      `not_authenticated`.
    messages:
      - $ref: '#/channels/api/messages/getMessageStatusRequest'
    reply:
      channel:
        $ref: '#/channels/api'
      messages:
        - $ref: '#/channels/api/messages/getMessageStatusResponse'
        - $ref: '#/channels/api/messages/errorResponse'
  deleteMessage:
    action: receive
    channel:
      $ref: '#/channels/api'
    summary: Delete one message
    description: |
      Action `messages.delete`. With mode `hidden` the message disappears from
      SMS Dock (web interface and API) but stays on the phone. With mode
      `provider` it is removed from the phone; this needs SMS Dock to be the
      phone's default SMS app. `status.deleteMode` tells which one applies.
      Before the login the answer is the error `not_authenticated`.
    messages:
      - $ref: '#/channels/api/messages/deleteMessageRequest'
    reply:
      channel:
        $ref: '#/channels/api'
      messages:
        - $ref: '#/channels/api/messages/deleteMessageResponse'
        - $ref: '#/channels/api/messages/errorResponse'
  deleteConversation:
    action: receive
    channel:
      $ref: '#/channels/api'
    summary: Delete a conversation
    description: |
      Action `conversations.delete`. Deletes all messages of a conversation.
      `deleted` is the number of messages. Before the login the answer is the
      error `not_authenticated`.
    messages:
      - $ref: '#/channels/api/messages/deleteConversationRequest'
    reply:
      channel:
        $ref: '#/channels/api'
      messages:
        - $ref: '#/channels/api/messages/deleteConversationResponse'
        - $ref: '#/channels/api/messages/errorResponse'
  markConversationRead:
    action: receive
    channel:
      $ref: '#/channels/api'
    summary: Mark a conversation as read
    description: |
      Action `conversations.markRead`. Marks all messages of a conversation as
      read. Android lets only the default SMS app change messages; otherwise
      the answer is the error `not_default_app`. Before the login the answer
      is the error `not_authenticated`.
    messages:
      - $ref: '#/channels/api/messages/markConversationReadRequest'
    reply:
      channel:
        $ref: '#/channels/api'
      messages:
        - $ref: '#/channels/api/messages/markConversationReadResponse'
        - $ref: '#/channels/api/messages/errorResponse'
  listContacts:
    action: receive
    channel:
      $ref: '#/channels/api'
    summary: Contacts of the phone
    description: |
      Action `contacts.list`. Returns a page of contacts, sorted by name.
      Before the login the answer is the error `not_authenticated`.
    messages:
      - $ref: '#/channels/api/messages/listContactsRequest'
    reply:
      channel:
        $ref: '#/channels/api'
      messages:
        - $ref: '#/channels/api/messages/listContactsResponse'
        - $ref: '#/channels/api/messages/errorResponse'
  subscribe:
    action: receive
    channel:
      $ref: '#/channels/api'
    summary: Choose events
    description: |
      Action `subscribe`. Adds the names to the subscription. `address`
      replaces the filter; without `address`, or with `null`, the filter is
      removed. The filter applies to events that name a peer;
      `conversations.changed` and events whose number is not known are always
      delivered. The result is the subscription now in force, with `*`
      replaced by the names it stands for. A new connection is subscribed to
      nothing. Before the login the answer is the error `not_authenticated`.
    messages:
      - $ref: '#/channels/api/messages/subscribeRequest'
    reply:
      channel:
        $ref: '#/channels/api'
      messages:
        - $ref: '#/channels/api/messages/subscribeResponse'
        - $ref: '#/channels/api/messages/errorResponse'
  unsubscribe:
    action: receive
    channel:
      $ref: '#/channels/api'
    summary: Stop events
    description: |
      Action `unsubscribe`. Removes the names from the subscription. When no
      name is left, the filter is removed too. The result is the subscription
      now in force. Before the login the answer is the error
      `not_authenticated`.
    messages:
      - $ref: '#/channels/api/messages/unsubscribeRequest'
    reply:
      channel:
        $ref: '#/channels/api'
      messages:
        - $ref: '#/channels/api/messages/unsubscribeResponse'
        - $ref: '#/channels/api/messages/errorResponse'
  ping:
    action: receive
    channel:
      $ref: '#/channels/api'
    summary: Keep-alive
    description: |
      Action `ping`. Returns the time of the phone. The server also sends
      WebSocket pings every 20 seconds and closes connections that do not
      answer within 45 seconds (close code 4408). Before the login the answer
      is the error `not_authenticated`.
    messages:
      - $ref: '#/channels/api/messages/pingRequest'
    reply:
      channel:
        $ref: '#/channels/api'
      messages:
        - $ref: '#/channels/api/messages/pingResponse'
        - $ref: '#/channels/api/messages/errorResponse'
  notifySmsReceived:
    action: send
    channel:
      $ref: '#/channels/api'
    summary: An SMS arrived
    description: |
      Event `sms.received`. Sent without being asked for to every client that
      subscribed to `sms.received` or to `*`.
    messages:
      - $ref: '#/channels/api/messages/smsReceived'
  notifySmsQueued:
    action: send
    channel:
      $ref: '#/channels/api'
    summary: SMS Dock accepted a message for sending
    description: |
      Event `sms.queued`. Sent without being asked for to every client that
      subscribed to `sms.queued` or to `*`.
    messages:
      - $ref: '#/channels/api/messages/smsQueued'
  notifySmsSent:
    action: send
    channel:
      $ref: '#/channels/api'
    summary: The network accepted a message
    description: |
      Event `sms.sent`. Sent without being asked for to every client that
      subscribed to `sms.sent` or to `*`.
    messages:
      - $ref: '#/channels/api/messages/smsSent'
  notifySmsDelivered:
    action: send
    channel:
      $ref: '#/channels/api'
    summary: The recipient's phone confirmed receipt
    description: |
      Event `sms.delivered`. Sent without being asked for to every client that
      subscribed to `sms.delivered` or to `*`.
    messages:
      - $ref: '#/channels/api/messages/smsDelivered'
  notifySmsFailed:
    action: send
    channel:
      $ref: '#/channels/api'
    summary: Sending failed
    description: |
      Event `sms.failed`. Sent without being asked for to every client that
      subscribed to `sms.failed` or to `*`.
    messages:
      - $ref: '#/channels/api/messages/smsFailed'
  notifySmsDeleted:
    action: send
    channel:
      $ref: '#/channels/api'
    summary: A message or a conversation was deleted
    description: |
      Event `sms.deleted`. Sent without being asked for to every client that
      subscribed to `sms.deleted` or to `*`.
    messages:
      - $ref: '#/channels/api/messages/smsDeleted'
  notifyConversationsChanged:
    action: send
    channel:
      $ref: '#/channels/api'
    summary: Messages changed outside SMS Dock
    description: |
      Event `conversations.changed`. Sent without being asked for to every client that
      subscribed to `conversations.changed` or to `*`.
    messages:
      - $ref: '#/channels/api/messages/conversationsChanged'

components:
  correlationIds:
    requestId:
      description: The response echoes the `id` of the request.
      location: $message.payload#/id

  messages:
    hello:
      name: hello
      title: hello
      summary: First frame of every connection
      contentType: application/json
      payload:
        $ref: '#/components/schemas/Hello'
      examples:
        - name: hello
          payload: {"event": "hello", "protocolVersion": 1, "authenticationRequired": true}
    authenticateRequest:
      name: authenticateRequest
      title: authenticate request
      summary: Log in
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/AuthenticateRequest'
      examples:
        - name: authenticate
          payload: {"id": "1", "action": "authenticate", "password": "your password"}
    authenticateResponse:
      name: authenticateResponse
      title: authenticate response
      summary: Success of authenticate
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        type: object
        required: [id, ok, result]
        properties:
          id:
            $ref: '#/components/schemas/EchoedId'
          ok:
            type: boolean
            const: true
          result:
            $ref: '#/components/schemas/AuthenticateResult'
      examples:
        - name: authenticate
          payload: {"id": "1", "ok": true, "result": {"protocolVersion": 1, "app": {"name": "SMS Dock", "version": "1.0.0", "protocolVersion": 1}, "latestSeq": 42, "epoch": 1790672000000}}
    getStatusRequest:
      name: getStatusRequest
      title: status request
      summary: Phone, SIMs, permissions, limits
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/StatusRequest'
      examples:
        - name: getStatus
          payload: {"id": "2", "action": "status"}
    getStatusResponse:
      name: getStatusResponse
      title: status response
      summary: Success of status
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        type: object
        required: [id, ok, result]
        properties:
          id:
            $ref: '#/components/schemas/EchoedId'
          ok:
            type: boolean
            const: true
          result:
            $ref: '#/components/schemas/Status'
      examples:
        - name: getStatus
          payload: {"id": "2", "ok": true, "result": {"app": {"name": "SMS Dock", "version": "1.0.0", "protocolVersion": 1}, "sims": [{"subscriptionId": 1, "slot": 0, "name": "Play", "number": null, "isDefault": true}], "permissions": {"readSms": true, "sendSms": true, "receiveSms": true, "contacts": true, "phoneState": true, "notifications": true}, "defaultSmsApp": false, "deleteMode": "hidden", "licence": {"enforced": false, "licensed": false, "dailyLimit": 10, "sentToday": 3, "remaining": null}, "popup": true}}
    listConversationsRequest:
      name: listConversationsRequest
      title: conversations.list request
      summary: Conversations, one per phone number
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/ConversationsListRequest'
      examples:
        - name: listConversations
          payload: {"id": "3", "action": "conversations.list", "unread": true, "limit": 20}
    listConversationsResponse:
      name: listConversationsResponse
      title: conversations.list response
      summary: Success of conversations.list
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        type: object
        required: [id, ok, result]
        properties:
          id:
            $ref: '#/components/schemas/EchoedId'
          ok:
            type: boolean
            const: true
          result:
            $ref: '#/components/schemas/ConversationPage'
      examples:
        - name: listConversations
          payload: {"id": "3", "ok": true, "result": {"items": [{"id": 179, "address": "+4369912345678", "contact": "Anna Example", "snippet": "Hello", "timestamp": 1790672531000, "direction": "in", "messageCount": 12, "unreadCount": 1, "sim": 1}], "nextCursor": null}}
    listMessagesRequest:
      name: listMessagesRequest
      title: messages.list request
      summary: Messages, filtered and paged
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/MessagesListRequest'
      examples:
        - name: listMessages
          payload: {"id": "7", "action": "messages.list", "direction": "in", "limit": 10}
    listMessagesResponse:
      name: listMessagesResponse
      title: messages.list response
      summary: Success of messages.list
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        type: object
        required: [id, ok, result]
        properties:
          id:
            $ref: '#/components/schemas/EchoedId'
          ok:
            type: boolean
            const: true
          result:
            $ref: '#/components/schemas/MessagePage'
      examples:
        - name: listMessages
          payload: {"id": "7", "ok": true, "result": {"items": [{"id": 2815, "conversationId": 179, "address": "+4369912345678", "contact": null, "direction": "in", "body": "STATUS", "timestamp": 1790672531000, "sentTimestamp": 1790672529000, "read": false, "status": "received", "sim": 1, "requestId": null}], "nextCursor": "1790672531000:2815"}}
    getMessageRequest:
      name: getMessageRequest
      title: messages.get request
      summary: One message
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
