          payload: {"event": "sms.deleted", "seq": 42, "data": {"id": 2813, "conversationId": 179, "address": "+4369912345678", "mode": "hidden"}}
    conversationsChanged:
      name: conversationsChanged
      title: conversations.changed
      summary: Messages changed outside SMS Dock
      contentType: application/json
      payload:
        type: object
        required: [event, seq, data]
        properties:
          event:
            type: string
            const: conversations.changed
          seq:
            $ref: '#/components/schemas/Sequence'
          data:
            $ref: '#/components/schemas/EmptyData'
      examples:
        - name: conversationsChanged
          payload: {"event": "conversations.changed", "seq": 42, "data": {}}

  schemas:
    RequestId:
      description: |
        Id of a request, chosen by the client. The response echoes it.
        Optional.
      oneOf:
        - type: string
        - type: number
      examples:
        - '7'

    EchoedId:
      description: |
        The `id` of the request, unchanged. `null` when the request had
        none or could not be read.
      oneOf:
        - type: string
        - type: number
        - type: 'null'

    Timestamp:
      type: integer
      format: int64
      description: Milliseconds since the Unix epoch.
      examples:
        - 1790672531000

    SubscriptionId:
      type: integer
      description: Subscription id of a SIM, as in `Sim.subscriptionId`.
      examples:
        - 1

    Limit:
      type: integer
      minimum: 1
      maximum: 200
      default: 50
      description: Page size.

    Cursor:
      type: string
      description: |
        `nextCursor` of the previous page, passed back unchanged. The
        content is opaque.
      examples:
        - '1790672531000:2813'

    Direction:
      type: string
      enum: [in, out]
      description: '`in` for incoming, `out` for outgoing.'

    DeleteMode:
      type: string
      enum: [hidden, provider]
      description: |
        `hidden`: the message disappears from SMS Dock (web interface and
        API) but stays on the phone. `provider`: it is removed from the
        phone; this needs SMS Dock to be the phone's default SMS app.

    EventName:
      type: string
      enum:
        - sms.received
        - sms.queued
        - sms.sent
        - sms.delivered
        - sms.failed
        - sms.deleted
        - conversations.changed
      description: Name of an event.

    Sequence:
      type: integer
      minimum: 1
      description: |
        Number of the event. It increases by one per event, counted over
        all events of the phone, and restarts at 1 when the app is
        restarted.

    Hello:
      type: object
      description: Greeting of the server. It has no `seq` and no `data`.
      required: [event, protocolVersion, authenticationRequired]
      properties:
        event:
          type: string
          const: hello
        protocolVersion:
          type: integer
          const: 1
          description: Protocol version of the server.
        authenticationRequired:
          type: boolean
          const: true
          description: Always `true`.

    # ---------------------------------------------------------------- requests

    AuthenticateRequest:
      type: object
      required: [action, password]
      properties:
        id:
          $ref: '#/components/schemas/RequestId'
        action:
          type: string
          const: authenticate
        password:
          type: string
          description: |
            The password that is set in the app, the same one the web
            interface uses.

    StatusRequest:
      type: object
      required: [action]
      properties:
        id:
          $ref: '#/components/schemas/RequestId'
        action:
          type: string
          const: status

    PingRequest:
      type: object
      required: [action]
      properties:
        id:
          $ref: '#/components/schemas/RequestId'
        action:
          type: string
          const: ping

    ConversationsListRequest:
      type: object
      required: [action]
      properties:
        id:
          $ref: '#/components/schemas/RequestId'
        action:
          type: string
          const: conversations.list
        limit:
          $ref: '#/components/schemas/Limit'
        cursor:
          $ref: '#/components/schemas/Cursor'
        q:
          type: string
          description: Search in text, numbers and contact names.
        unread:
          type: boolean
          default: false
          description: Only conversations with unread messages.
        sim:
          $ref: '#/components/schemas/SubscriptionId'

    MessagesListRequest:
      type: object
      required: [action]
      properties:
        id:
          $ref: '#/components/schemas/RequestId'
        action:
          type: string
          const: messages.list
        address:
          type: string
          description: |
            Only messages from or to this number; see "Phone numbers" in
            the description of this API.
        conversationId:
          type: integer
          description: Only this conversation; wins if `address` is given too.
        direction:
          type: string
          enum: [in, out, all]
          default: all
          description: Incoming, outgoing or both.
        q:
          type: string
          description: Search in the message text.
        from:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: Start of the time range, inclusive.
        to:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: End of the time range, inclusive.
        sim:
          $ref: '#/components/schemas/SubscriptionId'
        unread:
          type: boolean
          default: false
          description: Only unread messages.
        limit:
          $ref: '#/components/schemas/Limit'
        cursor:
          $ref: '#/components/schemas/Cursor'

    MessagesGetRequest:
      type: object
      required: [action, messageId]
      properties:
        id:
          $ref: '#/components/schemas/RequestId'
        action:
          type: string
          const: messages.get
        messageId:
          type: integer
          description: '`id` of the message.'

    MessagesSendRequest:
      type: object
      required: [action, to, body]
      properties:
        id:
          $ref: '#/components/schemas/RequestId'
        action:
          type: string
          const: messages.send
        to:
          type: string
          description: |
            Phone number. Spaces, dashes, dots, slashes and brackets are
            ignored.
          examples:
            - '+4369912345678'
        body:
          type: string
          description: |
            Text, at most 10 SMS parts (1530 plain or 670 Unicode
            characters).
        sim:
          allOf:
            - $ref: '#/components/schemas/SubscriptionId'
          description: Subscription id; default is the phone's SMS SIM.
        requestId:
          $ref: '#/components/schemas/SendRequestId'

    SendRequestId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9._-]{1,64}$'
      description: |
        Your own id of a message to send. It is remembered for 30 days.
        Sending the same `requestId` again does not send twice but
        returns the first result with its current `status`, also when
        that is `failed`. Using it again for another recipient or text is
        answered with `invalid_request`.
      examples:
        - b0c1d2

    MessagesStatusRequest:
      type: object
      required: [action, requestId]
      properties:
        id:
          $ref: '#/components/schemas/RequestId'
        action:
          type: string
          const: messages.status
        requestId:
          type: string
          description: The `requestId` from `messages.send`.

    MessagesDeleteRequest:
      type: object
      required: [action, messageId]
      properties:
        id:
          $ref: '#/components/schemas/RequestId'
        action:
          type: string
          const: messages.delete
        messageId:
          type: integer
          description: '`id` of the message.'

    ConversationsDeleteRequest:
      type: object
      required: [action, conversationId]
      properties:
        id:
          $ref: '#/components/schemas/RequestId'
        action:
          type: string
          const: conversations.delete
        conversationId:
          type: integer
          description: '`id` of the conversation.'

    ConversationsMarkReadRequest:
      type: object
      required: [action, conversationId]
      properties:
        id:
          $ref: '#/components/schemas/RequestId'
        action:
          type: string
          const: conversations.markRead
        conversationId:
          type: integer
          description: '`id` of the conversation.'

    ContactsListRequest:
      type: object
      required: [action]
      properties:
        id:
          $ref: '#/components/schemas/RequestId'
        action:
          type: string
          const: contacts.list
        q:
          type: string
          description: Search in names and numbers.
        limit:
          $ref: '#/components/schemas/Limit'
        cursor:
          $ref: '#/components/schemas/Cursor'

    SubscribeRequest:
      type: object
      required: [action, events]
      properties:
        id:
          $ref: '#/components/schemas/RequestId'
        action:
          type: string
          const: subscribe
        events:
          $ref: '#/components/schemas/EventSelection'
        address:
          type: [string, 'null']
          description: |
            Deliver `sms.*` events only for this number; see "Phone
            numbers" in the description of this API. It replaces the
            filter; without it, or with `null`, the filter is removed.

    UnsubscribeRequest:
      type: object
      required: [action, events]
      properties:
        id:
          $ref: '#/components/schemas/RequestId'
        action:
          type: string
          const: unsubscribe
        events:
          $ref: '#/components/schemas/EventSelection'

    EventSelection:
      type: array
      description: Event names, or `["*"]` for all.
      items:
        oneOf:
          - $ref: '#/components/schemas/EventName'
          - type: string
            const: '*'
      examples:
        - [sms.received]
        - ['*']

    # ----------------------------------------------------------------- results

    AuthenticateResult:
      type: object
      required: [protocolVersion, app, latestSeq, epoch]
      properties:
        protocolVersion:
          type: integer
          const: 1
        app:
          $ref: '#/components/schemas/AppInfo'
        latestSeq:
          type: integer
          minimum: 0
          description: Sequence number of the newest event so far.
        epoch:
          type: integer
          format: int64
          description: |
            Identifies one run of the app. When it differs from the one
            of the previous connection, the app was restarted and
            sequence numbers began at 1 again.

    AppInfo:
      type: object
      required: [name, version, protocolVersion]
      properties:
        name:
          type: string
          description: Name of the app.
          examples:
            - SMS Dock
        version:
          type: string
          description: Version of the app.
          examples:
            - 1.0.0
        protocolVersion:
          type: integer
          description: Protocol version of the server.

    MarkReadResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    PingResult:
      type: object
      required: [time]
      properties:
        time:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: Time of the phone.

    DeleteResult:
      type: object
      required: [deleted, mode]
      properties:
        deleted:
          type: integer
          minimum: 0
          description: Number of deleted messages.
        mode:
          $ref: '#/components/schemas/DeleteMode'

    Subscription:
      type: object
      description: The subscription in force.
      required: [events, address]
      properties:
        events:
          type: array
          description: |
            Names of the subscribed events, with `*` replaced by the names
            it stands for.
          items:
            $ref: '#/components/schemas/EventName'
        address:
          type: [string, 'null']
          description: |
            Number that `sms.*` events are limited to, or `null` without a
            limit.

    Message:
      type: object
      description: One SMS.
      required:
        - id
        - conversationId
        - address
        - contact
        - direction
        - body
        - timestamp
        - sentTimestamp
        - read
        - status
        - sim
        - requestId
      properties:
        id:
          type: [integer, 'null']
          description: |
            Id on the phone. `null` only in an `sms.received` event whose
            stored copy was not found in time.
        conversationId:
          type: [integer, 'null']
          description: Id of the conversation.
        address:
          type: string
          description: Peer number or sender name as stored.
        contact:
          type: [string, 'null']
          description: Name from the phone's contacts.
        direction:
          $ref: '#/components/schemas/Direction'
        body:
          type: string
          description: Text of the message.
        timestamp:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: Receive time for incoming, send time for outgoing messages.
        sentTimestamp:
          type: [integer, 'null']
          format: int64
          description: Incoming only; time from the sender's network.
        read:
          type: boolean
          description: Whether the message was read.
        status:
          type: string
          enum: [received, queued, sending, sent, delivered, failed]
          description: State of the message.
        sim:
          type: [integer, 'null']
          description: Subscription id of the SIM.
        requestId:
          type: [string, 'null']
          description: Set for messages sent through SMS Dock.

    Conversation:
      type: object
      description: All messages exchanged with one phone number.
      required:
        - id
        - address
        - contact
        - snippet
        - timestamp
        - direction
        - messageCount
        - unreadCount
        - sim
      properties:
        id:
          type: integer
          description: Id of the conversation.
        address:
          type: string
          description: Peer number or sender name as stored.
        contact:
          type: [string, 'null']
          description: Name from the phone's contacts.
        snippet:
          type: string
          maxLength: 160
          description: Newest message, cut to 160 characters.
        timestamp:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: Time of the newest message.
        direction:
          allOf:
            - $ref: '#/components/schemas/Direction'
          description: Direction of the newest message.
        messageCount:
          type: integer
          minimum: 0
          description: Number of messages.
        unreadCount:
          type: integer
          minimum: 0
          description: Number of unread messages.
        sim:
          type: [integer, 'null']
          description: Subscription id of the SIM of the newest message.

    Contact:
      type: object
      description: One contact of the phone.
      required: [name, numbers]
      properties:
        name:
          type: string
          description: Display name.
        numbers:
          type: array
          description: Phone numbers of the contact.
          items:
            $ref: '#/components/schemas/ContactNumber'

    ContactNumber:
      type: object
      required: [number, label]
      properties:
        number:
          type: string
          description: Phone number as stored.
        label:
          type: [string, 'null']
          description: Kind of number, for example `Mobile`.

    Sim:
      type: object
      description: One SIM of the phone.
      required: [subscriptionId, slot, name, number, isDefault]
      properties:
        subscriptionId:
          type: integer
          description: Id to use as `sim` in requests.
        slot:
          type: integer
          description: Slot of the SIM, starting at 0.
        name:
          type: string
          description: Name of the SIM or of the network.
        number:
          type: [string, 'null']
          description: Phone number of the SIM if the phone knows it.
        isDefault:
          type: boolean
          description: Whether this is the phone's SIM for SMS.

    Status:
      type: object
      description: Phone, SIMs, permissions and limits.
      required:
        - app
        - sims
        - permissions
        - defaultSmsApp
        - deleteMode
        - licence
        - popup
      properties:
        app:
          $ref: '#/components/schemas/AppInfo'
        sims:
          type: array
          description: SIMs of the phone.
          items:
            $ref: '#/components/schemas/Sim'
        permissions:
          type: object
          description: Android permissions; `true` when granted.
          required:
            - readSms
            - sendSms
            - receiveSms
            - contacts
            - phoneState
            - notifications
          properties:
            readSms:
              type: boolean
            sendSms:
              type: boolean
            receiveSms:
              type: boolean
            contacts:
              type: boolean
            phoneState:
              type: boolean
            notifications:
              type: boolean
        defaultSmsApp:
          type: boolean
          description: Whether SMS Dock is the phone's default SMS app.
        deleteMode:
          allOf:
            - $ref: '#/components/schemas/DeleteMode'
          description: What a delete does at the moment.
        licence:
          type: object
          required: [enforced, licensed, dailyLimit, sentToday, remaining]
          properties:
            enforced:
              type: boolean
              description: Whether the app enforces the licence.
            licensed:
              type: boolean
              description: Whether the full licence was bought.
            dailyLimit:
              type: integer
              description: SMS per day in the free version.
            sentToday:
              type: integer
              description: SMS sent today.
            remaining:
              type: [integer, 'null']
              description: |
                SMS left today, or `null` when sending is unlimited.
        popup:
          type: boolean
          description: Whether the web interface shows incoming SMS as a pop-up.

    SendResult:
      type: object
      description: Result of `messages.send`.
      required: [requestId, to, parts, status]
      properties:
        requestId:
          type: string
          description: Id of the message in the outbox; yours if you sent one.
        to:
          type: string
          description: The number as it is sent, without the ignored characters.
        parts:
          type: integer
          minimum: 1
          maximum: 10
          description: Number of SMS parts.
        status:
          $ref: '#/components/schemas/OutboxStatus'

    OutboxStatus:
      type: string
      enum: [queued, sending, sent, delivered, failed]
      description: |
        State of a message sent through SMS Dock: `queued` (handed to the
        phone), `sending` (some parts left), `sent`, `delivered` or
        `failed`.

    Source:
      type: string
      enum: [web, api, app]
      description: 'Who sent the message: `web`, `api` or `app`.'

    OutboxEntry:
      type: object
      description: State of a message sent through SMS Dock.
      required:
        - requestId
        - to
        - parts
        - partsSent
        - status
        - errorCode
        - messageId
        - sim
        - source
        - createdAt
      properties:
        requestId:
          type: string
          description: Id of the message in the outbox.
        to:
          type: string
          description: Number of the recipient.
        parts:
          type: integer
          description: Number of SMS parts.
        partsSent:
          type: integer
          description: Parts the network accepted so far.
        status:
          $ref: '#/components/schemas/OutboxStatus'
        errorCode:
          type: [integer, 'null']
          description: Result code of Android for a failed message.
        messageId:
          type: [integer, 'null']
          description: Id of the stored message once it exists.
        sim:
          type: [integer, 'null']
          description: Subscription id of the SIM.
        source:
          $ref: '#/components/schemas/Source'
        createdAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: Time the message was accepted.

    Page:
      type: object
      description: |
        A list is returned as a page. Pass `nextCursor` as `cursor` to get
        the next page.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Items of this page.
        nextCursor:
          type: [string, 'null']
          description: '`null` on the last page.'

    MessagePage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Message'

    ConversationPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Conversation'

    ContactPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Contact'

    # ------------------------------------------------------------------ errors

    Error:
      type: object
      description: Error of a request.
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid_json
            - invalid_request
            - unknown_action
            - not_authenticated
            - invalid_password
            - locked_out
            - licence_required
            - quota_exceeded
            - rate_limited
            - permission_missing
            - invalid_number
            - message_too_long
            - sim_unavailable
            - not_found
            - not_default_app
            - send_failed
            - internal_error
          description: See the table of error codes in the description of this API.
        message:
          type: string
          description: Text for people, in English.
        retryAfter:
          type: integer
          description: |
            Seconds to wait. Present for `locked_out` and for
            `rate_limited` because of too many requests per second.
        permission:
          type: string
          description: '`permission_missing` only: the Android permission that is not granted.'

    ErrorResponse:
      type: object
      required: [id, ok, error]
      properties:
        id:
          $ref: '#/components/schemas/EchoedId'
        ok:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/Error'

    # ------------------------------------------------------------- event data

    SmsReceivedData:
      type: object
      required: [message]
      properties:
        message:
          $ref: '#/components/schemas/Message'

    SmsQueuedData:
      type: object
      required: [requestId, to, parts, sim, source]
      properties:
        requestId:
          type: string
          description: Id of the message in the outbox.
        to:
          type: string
          description: Number of the recipient.
        parts:
          type: integer
          description: Number of SMS parts.
        sim:
          type: [integer, 'null']
          description: Subscription id of the SIM.
        source:
          $ref: '#/components/schemas/Source'

    SmsSentData:
      type: object
      required: [requestId, conversationId, to, message]
      properties:
        requestId:
          type: [string, 'null']
          description: '`null` if another app sent the message.'
        conversationId:
          type: [integer, 'null']
          description: |
            Id of the conversation; `null` as long as the phone has not
            stored the message.
        to:
          type: string
          description: Number of the recipient.
        message:
          oneOf:
            - $ref: '#/components/schemas/Message'
            - type: 'null'
          description: The stored message, or `null` if it was not found.

    SmsDeliveredData:
      type: object
      required: [requestId, id, conversationId, to]
      properties:
        requestId:
          type: [string, 'null']
          description: Id of the message in the outbox.
        id:
          type: [integer, 'null']
          description: |
            Message id; `null` as long as the phone has not stored the
            message.
        conversationId:
          type: [integer, 'null']
          description: |
            Id of the conversation; `null` as long as the phone has not
            stored the message.
        to:
          type: string
          description: Number of the recipient.

    SmsFailedData:
      type: object
      required: [requestId, id, conversationId, to, errorCode, reason]
      properties:
        requestId:
          type: [string, 'null']
          description: Id of the message in the outbox.
        id:
          type: [integer, 'null']
          description: |
            Message id; `null` as long as the phone has not stored the
            message.
        conversationId:
          type: [integer, 'null']
          description: |
            Id of the conversation; `null` as long as the phone has not
            stored the message.
        to:
          type: string
          description: Number of the recipient.
        errorCode:
          type: [integer, 'null']
          description: Result code of Android.
        reason:
          type: [string, 'null']
          description: |
            Name of the result code: `generic_failure`, `radio_off`,
            `null_pdu`, `no_service`, `limit_exceeded`,
            `fdn_check_failure`, `short_code_not_allowed`,
            `short_code_never_allowed`, or `error_N` for other codes.

    SmsDeletedData:
      type: object
      required: [id, conversationId, address, mode]
      properties:
        id:
          type: [integer, 'null']
          description: Message id; `null` when a whole conversation was deleted.
        conversationId:
          type: [integer, 'null']
          description: Id of the conversation.
        address:
          type: [string, 'null']
          description: Peer number or sender name of the deleted messages.
        mode:
          $ref: '#/components/schemas/DeleteMode'

    EmptyData:
      type: object
      description: No fields.
